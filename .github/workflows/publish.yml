# Builds and publishes countmut to PyPI on every version bump (pyproject.toml)
# on main, or on a published GitHub release.
#
# The C core (backend/countmut_core) is compiled here and bundled into the
# wheel at countmut/_core/countmut_core, so `uv tool install countmut` / pip
# installs work out of the box.

name: Upload Python Package

on:
  push:
    paths:
      - 'pyproject.toml'
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential liblua5.4-dev zlib1g-dev
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build the C core and bundle it into the package
        run: |
          make -C backend
          mkdir -p countmut/_core
          cp backend/countmut_core countmut/_core/countmut_core

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
