name: Test

on:
  push:
    branches: [main, dev]
    paths:
      - 'countmut/**'
      - 'backend/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Lua 5.4 for the C -e/-p filters)
        run: |
          sudo apt-get update
          sudo apt-get install -y liblua5.4-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Lint with ruff
        run: |
          uv run ruff check countmut/

      - name: Format check with ruff
        run: |
          uv run ruff format --check countmut/

      - name: Run tests
        run: |
          uv run pytest tests/ -v --cov=countmut --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

